const EN={"Desa Karrow. Dulu lonceng fajar berbunyi di sini setiap pagi. Kini hanya abu, gagak, dan sunyi.": "Karrow Village. Once the dawn bell rang here every morning. Now there is only ash, crows, and silence.", "Varn, mantan Penjaga Fajar, berdiri di gerbang desa yang telah menjadi kuburan.": "Varn, former Dawn Guardian, stands at the gate of a village that has become a graveyard.", "TETUA HOLD": "ELDER HOLD", "Varn... kau kembali. Sepuluh tahun kau menghilang, dan kau pulang saat semuanya sudah terlambat.": "Varn... you came back. Ten years you vanished, and you return when it is all too late.", "Di mana Selene? Di mana Laras?": "Where is Selene? Where is Laras?", "Altar Utara. Malakar menyeret mereka ke sana, bersama semua anak yang lahir saat fajar.": "The Northern Altar. Malakar dragged them there, along with every child born at dawn.", "Malakar... maksudmu Kael? Guruku sendiri?": "Malakar... you mean Kael? My own master?", "Ia telah menelan fajar itu. Tak ada lagi pagi, Varn. Hanya lapar yang berjalan dengan wajah manusia.": "He has devoured the dawn. There is no more morning, Varn. Only hunger walking in a human face.", "Jalan ke utara penuh mayat yang tak diizinkan tidur. Tebas mereka, ambil darahnya. Darah adalah satu-satunya bahasa yang masih dimengerti kegelapan.": "The road north is full of corpses forbidden to sleep. Cut them down, take their blood. Blood is the only language the darkness still understands.", "Tebas musuh. Musuh yang berkedip putih bisa dieksekusi: darah dua kali lipat. Serang BERAT berulang sampai kotak stun terbuka di atas musuh, lalu tekan O untuk eksekusi sinematik. ESC atau tombol menu untuk jeda.": "Slash your enemies. Enemies flashing white can be executed: double blood. Strike HEAVY repeatedly until the stun box opens above an enemy, then press O for a cinematic execution. ESC or the menu button to pause.", "Wajah-wajah ini... aku mengenal mereka. Petani, pandai besi, anak penjaga lonceng.": "These faces... I know them. Farmers, blacksmiths, the bell-keeper's child.", "Maafkan aku. Kalian akan mendapat tidur yang layak.": "Forgive me. You will have a proper rest.", "Rawa Ghul. Air sehitam jelaga dan berbau bangkai. Setiap gelembung membawa bisikan orang mati.": "Ghul Swamp. Water black as soot and reeking of carrion. Every bubble carries the whispers of the dead.", "Varn... Penjaga... kami menunggumu. Lama sekali.": "Varn... Guardian... we have been waiting for you. For so long.", "Dia bukan Kael lagi. Namanya sudah ia telan bersama fajar. Kini ia menyebut dirinya Malakar.": "He is no longer Kael. He swallowed that name along with the dawn. Now he calls himself Malakar.", "Kenapa ia melakukannya?": "Why did he do it?", "Ada gerbang yang tak boleh dibuka. Seseorang membukanya. Kael menelan fajar untuk menutupnya kembali.": "There is a gate that must never be opened. Someone opened it. Kael devoured the dawn to close it again.", "Tebas kami, Penjaga. Kami tak sanggup mendengar kebenaran lagi.": "Cut us down, Guardian. We can no longer bear to hear the truth.", "Prajurit berperisai dan pemanah berbisa mengintai. Perisai pecah oleh serangan BERAT atau PARRY.": "Shielded soldiers and venomous archers lie in wait. Shields break from HEAVY attacks or a PARRY.", "Waspada: cincin UNGU di sekeliling musuh menandakan serangan yang tak bisa di-PARRY. Hindari dengan DODGE.": "Beware: a PURPLE ring around an enemy marks an attack that cannot be parried. Avoid it with DODGE.", "Tanah bergetar. Sesuatu yang besar bangkit dari lumpur, dibalut rantai berkarat.": "The ground trembles. Something huge rises from the mud, wrapped in rusted chains.", "Itu dulu kepala desa kami. Bebaskan dia dari rantainya, Penjaga.": "That was once our village head. Free him from his chains, Guardian.", "Di antara timbunan tulang, seorang pedagang bayangan duduk menghitung sesuatu yang tak terlihat.": "Among piles of bones, a shadow merchant sits counting something unseen.", "Orb darah yang segar... Kau berbau penyesalan, Penjaga. Itu mata uang yang bagus.": "Fresh blood orbs... You reek of regret, Guardian. A fine currency.", "Tempa senjatamu. Pelajari tebasan baru. Malakar tak akan memberimu kesempatan kedua.": "Forge your weapon. Learn new strikes. Malakar will not give you a second chance.", "Ia bukan yang terburuk di altar itu. Yang terburuk sudah lama kau kenal.": "He is not the worst at that altar. You have known the worst for a long time.", "Belanjakan orb merah untuk menempa senjata dan mempelajari skill. Menu bisa dibuka kapan saja lewat ESC.": "Spend red orbs to forge weapons and learn skills. The menu can be opened anytime with ESC.", "Lorong Segel. Dinding berdenyut seperti daging hidup. Di sana, relief menceritakan satu kisah.": "Seal Corridor. The walls pulse like living flesh. There, a relief tells a single story.", "Seorang Penjaga membuka gerbang terlarang demi menyelamatkan istrinya. Wajah pahatan itu wajah Varn.": "A Guardian opened the forbidden gate to save his wife. The carved face is Varn's.", "Sepuluh tahun aku menguburnya. Sepuluh tahun aku berpura-pura itu hanya mimpi.": "Ten years I buried it. Ten years I pretended it was only a dream.", "Jadi Kael menelan fajar karena kesalahanku.": "So Kael devoured the dawn because of my mistake.", "Tak ada bedanya sekarang. Aku tetap harus membawa Laras pulang.": "It makes no difference now. I must still bring Laras home.", "Berhenti, Penjaga. Di ujung lorong bukan hanya kegelapan. Ada dirimu sendiri.": "Stop, Guardian. At the end of this corridor lies more than darkness. There is yourself.", "Aku sudah lama berdamai dengan itu.": "I made peace with that long ago.", "Lantai retak. Cahaya merah merembes dari bawah, memanggil.": "The floor cracks. Red light seeps from below, calling.", "Sedikit lagi. Bertahanlah, Laras.": "Just a little more. Hold on, Laras.", "Altar Malakar. Tak ada langit di sini, hanya kegelapan yang bernapas. Puluhan sangkar tulang menggantung di atas, masing-masing berisi cahaya kecil yang berdenyut.": "Malakar's Altar. There is no sky here, only breathing darkness. Dozens of bone cages hang above, each holding a small pulsing light.", "Salah satu sangkar bergetar. Di dalamnya, siluet anak kecil menoleh ke arahnya.": "One of the cages trembles. Inside, the silhouette of a child turns toward him.", "Varn. Muridku. Kau lebih tua, tapi tak lebih bijak.": "Varn. My student. You are older, but no wiser.", "Kembalikan mereka, Kael.": "Give them back, Kael.", "Kael sudah mati sepuluh tahun lalu. Ia mati menutup gerbang yang kau buka.": "Kael died ten years ago. He died closing the gate you opened.", "Fajar dalam perutku satu-satunya yang menahan kegelapan itu. Bunuh aku, dan semuanya berakhir. Semuanya.": "The dawn in my belly is the only thing holding back that darkness. Kill me, and everything ends. Everything.", "Aku tak peduli pada dunia. Aku hanya peduli pada mereka.": "I don't care about the world. I only care about them.", "Kalau begitu, buktikan cintamu dengan darah.": "Then prove your love with blood.", "Lumayan. Tapi fajar tak akan pernah menerimamu lagi.": "Not bad. But the dawn will never accept you again.", "Dengar! Jiwa-jiwa yang kutelan meneriakkan namamu!": "Listen! The souls I devoured are screaming your name!", "Bertahanlah... aku datang.": "Hold on... I'm coming.", "Malakar runtuh. Dari dadanya mengalir cahaya keemasan, naik menembus langit yang selama sepuluh tahun tertutup.": "Malakar collapses. Golden light flows from his chest, rising through a sky that has been shut for ten years.", "Untuk pertama kalinya, fajar menyentuh tanah Karrow.": "For the first time, dawn touches the land of Karrow.", "Ayah...? Kau datang.": "Father...? You came.", "Selalu, Nak. Sampai napas terakhirku.": "Always, child. Until my last breath.", "Tapi cahaya itu terus naik, dan tubuh Laras memudar bersamanya. Fajar yang kembali meminta bayaran yang tak pernah tercatat.": "But the light keeps rising, and Laras's body fades with it. The returned dawn demands a price never recorded.", "Berhentilah menyalahkan dirimu, Varn. Kami sudah lama memaafkanmu.": "Stop blaming yourself, Varn. We forgave you long ago.", "Varn berdiri sendirian di altar yang runtuh. Untuk pertama kalinya dalam sepuluh tahun, ia tak membawa dendam. Ia hanya membawa kehilangan.": "Varn stands alone at the ruined altar. For the first time in ten years, he carries no grudge. He carries only loss.", "Di reruntuhan kuil jauh di selatan, obor patung Kael menyala kembali.": "In the temple ruins far to the south, the torch of Kael's statue burns again.", "Varn memungut kalung kayu itu dan berjalan menuju cahaya yang baru terbit. Penjaga terakhir, kini bukan pembawa dendam, melainkan pembawa janji.": "Varn picks up the wooden necklace and walks toward the newly risen light. The last Guardian, now not a bearer of vengeance, but a bearer of a promise.", "Tepuk tangan pelan bergema di reruntuhan. Pedagang bayangan berdiri di sana, dan bayangannya tak mengikuti gerak tubuhnya.": "Slow applause echoes through the ruins. The shadow merchant stands there, and his shadow does not follow his movements.", "Kael menutup gerbang dengan fajar. Kau baru saja mencabut fajar itu. Gerbangnya terbuka lagi.": "Kael closed the gate with the dawn. You just tore that dawn away. The gate is open again.", "Kau tahu ini akan terjadi.": "You knew this would happen.", "Namaku Nyarak. Akulah yang bicara denganmu di gerbang sepuluh tahun lalu. Turunlah, Penjaga. Kesempatan kedua belum habis.": "My name is Nyarak. I am the one who spoke to you at the gate ten years ago. Come down, Guardian. The second chance is not over yet.", "Varn memungut kalung kayu Laras, lalu melangkah ke retakan yang menganga di lantai altar.": "Varn picks up Laras's wooden necklace, then steps into the yawning crack in the altar floor.", "Jurang Gerbang. Retakan di bawah altar membuka ke ruang tanpa langit, tempat waktu berjalan mundur.": "Gate Abyss. The crack beneath the altar opens into a skyless space where time runs backward.", "Di dinding, wajah-wajah orang yang pernah Varn tinggalkan mengintip lewat celah batu.": "On the walls, the faces of those Varn left behind peer through the gaps in the stone.", "Kael menutup ini sendirian. Sepuluh tahun. Dan aku tidur nyenyak.": "Kael closed this alone. Ten years. And I slept soundly.", "Bayangan bangkit dari lantai, mengenakan zirah Penjaga Fajar yang telah gugur.": "A shadow rises from the floor, wearing the armor of a fallen Dawn Guardian.", "Varn? Kau terlambat, Nak. Kami menahan gerbang ini sampai fajar kami habis.": "Varn? You're late, child. We held this gate until our dawn ran out.", "Maafkan aku. Aku akan menyelesaikannya.": "Forgive me. I will finish it.", "Pedagang bayangan tak ada. Hanya peti kosong dan selembar kain merah yang biasa ia duduki.": "The shadow merchant is gone. Only an empty chest and the red cloth he used to sit on.", "Jadi ini semua permainanmu.": "So this is all your game.", "Orb-orb darah tua tertinggal di atas peti. Varn menempa senjatanya sendiri, kali ini tanpa tawar-menawar.": "Old blood orbs are left on the chest. Varn forges his weapon himself, this time without bargaining.", "Padang Penyesalan. Kabut kelabu, dan setiap helai rumput adalah janji yang belum ditepati.": "Field of Regret. Grey mist, and every blade of grass is a promise left unkept.", "Selene berdiri di kejauhan, seperti di hari terakhirnya. Tapi bayangannya menoleh terlalu lambat.": "Selene stands in the distance, as on her last day. But her shadow turns too slowly.", "Varn... jangan lanjutkan. Bukan aku yang memanggilmu.": "Varn... do not go on. It is not I who is calling you.", "Aku tahu. Tapi aku ingin mendengar suaramu sekali lagi.": "I know. But I wanted to hear your voice once more.", "Nyarak memakai kerinduanmu sebagai umpan. Kalau kau tunduk, gerbang tak akan pernah tertutup.": "Nyarak uses your longing as bait. If you yield, the gate will never close.", "Kabut memadat menjadi prajurit yang membawa wajah-wajah yang Varn kenal.": "The mist thickens into soldiers wearing faces Varn knows.", "Kau bisa berhenti di sini, Varn. Kau sudah cukup menebus dosamu.": "You can stop here, Varn. You have atoned enough.", "Bukan aku yang menentukan cukup.": "It is not for me to decide what is enough.", "Kabut menggelegak. Sosok raksasa berzirah merah terbentuk dari kenangan pertempuran lama.": "The mist boils. A giant in red armor forms from memories of old battles.", "Ini bayanganku sendiri. Yang dulu memenggal para dewa.": "This is my own shadow. The one who once beheaded the gods.", "Singgasana Nyarak. Ruang tanpa dinding, hanya gerbang raksasa yang retak dan menyala emas dari sisi seberang.": "Nyarak's Throne. A room without walls, only a giant cracked gate glowing gold from the other side.", "Kau datang juga. Aku sudah menyiapkan tawaran: satu nyawa untuk satu gerbang.": "You came after all. I have prepared an offer: one life for one gate.", "Bawa pulang Laras dan Selene, biarkan dunia terbakar. Atau tutup gerbang ini dengan hidupmu.": "Bring Laras and Selene home and let the world burn. Or close this gate with your life.", "Aku sudah menawar terlalu lama denganmu.": "I have bargained with you for too long.", "Kalau begitu, buktikan pilihanmu dengan darah.": "Then prove your choice with blood.", "Kau menebas seperti orang yang lelah, Penjaga. Lelah dan penuh dosa.": "You strike like one who is weary, Guardian. Weary and full of sin.", "Gerbang ini lapar akan penyesalanmu! Beri makan ia!": "This gate hungers for your regret! Feed it!", "Cukup. Aku sudah selesai menyesal.": "Enough. I am done regretting.", "Nyarak jatuh berlutut. Gerbang retak berdenyut, menarik bayangannya kembali ke sisi seberang.": "Nyarak falls to his knees. The cracked gate pulses, pulling his shadow back to the other side.", "Kau bodoh... siapa yang akan menjaganya setelah aku pergi?": "You fool... who will guard it after I am gone?", "Varn menyalakan obor Kael dengan sisa fajar di tubuhnya, lalu menancapkannya di ambang gerbang. Retakan menutup, perlahan.": "Varn lights Kael's torch with the last of the dawn within him, then plants it in the gate's threshold. The crack closes, slowly.", "Aku sudah pulang, Nak. Tidurlah. Fajar akan kujaga.": "I'm home, child. Sleep. I will keep the dawn.", "Bertahun-tahun kemudian, warga Karrow melihat seorang lelaki tua duduk di ambang gerbang yang tak pernah terbuka lagi. Lonceng fajar kembali berbunyi setiap pagi.": "Years later, the people of Karrow see an old man sitting at the threshold of a gate that never opened again. The dawn bell rings again every morning.", "Penjaga terakhir tak pernah pergi. Ia menjadi janji itu sendiri.": "The last Guardian never left. He became the promise itself.", "HP maks: setengah sampai penuh": "Max HP: half up to full", "Gelombang Darah": "Blood Wave", "Pedang: tebasan jarak jauh": "Sword: ranged slash", "Hujan Tombak": "Spear Rain", "Tombak: 3 tombakan menembus": "Spear: 3 piercing throws", "Hentak Bumi": "Earth Slam", "Palu: ledakan + pingsan": "Hammer: blast + stun", "Cincin Api": "Ring of Fire", "Rantai: api 360 derajat": "Chain: 360-degree fire", "Berkah Fajar": "Dawn's Blessing", "Katana: pulihkan HP + ledakan": "Katana: restore HP + blast", "POHON PENINGKATAN": "UPGRADE TREE", "TEMPA SENJATA  •  ORB DARAH: ": "FORGE WEAPONS  •  BLOOD ORBS: ", "TINGKAT ": "LEVEL ", "PENINGKATAN MAKSIMAL": "MAX LEVEL", "SENJATA BELUM TERBUKA": "WEAPON LOCKED", "BIAYA TEMPA: ": "FORGE COST: ", " ORB": " ORBS", "TEMPA UPGRADE": "FORGE UPGRADE", "PILIH SIMBOL DI KIRI  •  ESC UNTUK KEMBALI": "PICK A SYMBOL ON THE LEFT  •  ESC TO GO BACK", "PENGATURAN SUARA": "SOUND SETTINGS", "POHON UPGRADE": "UPGRADE TREE", "SIMPAN & MENU UTAMA": "SAVE & MAIN MENU", "ESC / ☰  •  KEMBALI KE PERTEMPURAN": "ESC / ☰  •  BACK TO BATTLE", "Gua Tulang. Stalaktit menetes seperti gigi raksasa yang lapar. Di dinding, ribuan nama terukir oleh kuku.": "Bone Cave. Stalactites drip like the teeth of a hungry giant. On the walls, thousands of names carved by fingernails.", "Di lantai tergeletak sebuah kalung kayu kecil, ukiran matahari yang belum selesai. Varn mengenalinya.": "On the floor lies a small wooden necklace, a half-finished sun carving. Varn recognizes it.", "Laras... dia melewati tempat ini.": "Laras... she passed through here.", "Ia masih hidup, Penjaga. Tapi cahayanya menipis setiap kali Malakar bernapas.": "She is still alive, Guardian. But her light thins each time Malakar breathes.", "Seorang peramal buta terikat rantai pada dinding gua. Matanya dijahit dengan benang perak.": "A blind seer is chained to the cave wall. Her eyes are sewn shut with silver thread.", "Aku Sirin. Malakar menjahit mataku agar aku tak bisa melihat masa depan. Ia takut pada apa yang kulihat.": "I am Sirin. Malakar sewed my eyes so I could not see the future. He fears what I saw.", "Apa yang kau lihat?": "What did you see?", "Dua akhir. Di satu akhir dunia terbakar. Di akhir lainnya... kau tinggal sendirian. Aku tak tahu mana yang lebih buruk.": "Two endings. In one the world burns. In the other... you remain alone. I do not know which is worse.", "Jembatan Api ada di depan. Para dewa yang kau bunuh menjaganya. Mereka belum lupa wajahmu.": "The Fire Bridge lies ahead. The gods you slew guard it. They have not forgotten your face.", "Tulang-tulang di lantai bergerak, merakit diri menjadi sesuatu yang berjalan.": "The bones on the floor move, assembling themselves into something that walks.", "Langit-langit gua runtuh. Sesuatu yang besar melangkah keluar dari balik reruntuhan.": "The cave ceiling collapses. Something huge steps out from the rubble.", "Jagal Gua. Salah satu anjing peliharaan Malakar.": "Cave Butcher. One of Malakar's pet hounds.", "Pedagang bayangan itu kembali, kini duduk di atas peti yang tak pernah kau lihat sebelumnya.": "The shadow merchant is back, now sitting on a chest you have never seen before.", "Kau masih hidup. Menarik. Kebanyakan orang berhenti di sini.": "You are still alive. Interesting. Most people stop here.", "Jembatan di depan dibangun dari tulang dewa. Api di bawahnya adalah amarah mereka yang kau bunuh. Tempa senjatamu.": "The bridge ahead is built from god-bone. The fire beneath is the rage of those you killed. Forge your weapon.", "Jembatan Api. Bentang batu hitam di atas lautan lava yang menyanyikan nama-nama.": "Fire Bridge. A span of black stone above a sea of lava that sings names.", "Di ujung pandang, siluet raksasa berapi berdiri: sisa dewa yang dulu Varn bunuh, kini hanya bayang.": "At the edge of sight, a giant fiery silhouette stands: the remnant of a god Varn once slew, now only a shadow.", "Pembunuh dewa... kau datang lagi. Dulu kau memenggal kami demi seorang wanita.": "Godslayer... you come again. You once beheaded us for the sake of a woman.", "Selene sekarat. Tak ada dewa yang mau menolong.": "Selene was dying. No god would help.", "Kami menolak karena ia sudah mati sebelum kau tiba. Kau tak pernah bertanya. Kau hanya menebas.": "We refused because she had already died before you arrived. You never asked. You only slashed.", "Varn terdiam. Lava di bawah bergolak seolah menertawakan.": "Varn falls silent. The lava below churns as if laughing.", "Setiap dosa punya jembatan. Ini milikmu.": "Every sin has a bridge. This one is yours.", "Api menyembur dari kedua sisi, membentuk dinding yang berdenyut.": "Fire erupts from both sides, forming a pulsing wall.", "Kau akan membayar dengan setiap jiwa yang kau kirim pada kami.": "You will pay with every soul you sent to us.", "Kuil Fajar Retak. Dulu tempat para Penjaga disumpah. Kini matahari di kubahnya retak seperti telur busuk.": "Cracked Dawn Temple. Once where the Guardians were sworn in. Now the sun in its dome is cracked like a rotten egg.", "Di tengah aula berdiri patung Kael muda, tersenyum, memegang obor yang padam.": "In the middle of the hall stands a statue of young Kael, smiling, holding an extinguished torch.", "Guru... aku kembali dengan tangan berlumur darah.": "Master... I return with blood-stained hands.", "Dengar: bila kau harus membunuhku, lakukan tanpa amarah. Amarah hanya memberi makan apa yang sudah kelaparan.": "Listen: if you must kill me, do it without rage. Rage only feeds what is already starving.", "Jangan minta hal mustahil.": "Don't ask the impossible.", "Justru karena mustahil. Itulah arti Penjaga.": "Precisely because it is impossible. That is what being a Guardian means.", "Pintu kuil terbanting. Para pemuja yang dulu menyembah fajar berdiri bisu, mata mereka kosong.": "The temple doors slam. The cultists who once worshipped the dawn stand mute, their eyes empty.", "Mereka... para murid Kael.": "They... are Kael's disciples.", "Akan kuberikan.": "I will give it.", "Sebelum pintu altar, pedagang bayangan itu duduk dengan senyum yang terlalu lebar.": "Before the altar door, the shadow merchant sits with a smile too wide.", "Ini terakhir kali kita bertemu, Penjaga.": "This is the last time we meet, Guardian.", "Siapa kau sebenarnya?": "Who are you really?", "Seseorang yang menjual kesempatan kedua kepada orang-orang yang tak pantas mendapatkannya. Siapkan dirimu.": "Someone who sells second chances to people who do not deserve them. Prepare yourself.", "Sepuluh tahun lalu. Badai mengamuk di atas sebuah gerbang emas yang terbuka sendiri, dan seorang lelaki berlumur darah berlutut di hadapannya.": "Ten years ago. A storm rages above a golden gate that opened by itself, and a blood-soaked man kneels before it.", "Satu nyawa untuk satu gerbang, Penjaga. Kau tahu harganya.": "One life for one gate, Guardian. You know the price.", "Bukakan. Berapa pun harganya.": "Open it. Whatever the price.", "Tawaran diterima. Ingat, kau yang memilih.": "Offer accepted. Remember, you chose this.", "Gelap. Sepuluh tahun kemudian, lelaki itu terbangun dengan nama yang sama, tanpa apa pun yang tersisa untuk dipertahankan.": "Darkness. Ten years later, the man wakes with the same name, with nothing left to protect.", "Sesuatu di dada Varn pecah. Dunia memerah, dan setiap suara menjadi dengung yang jauh.": "Something in Varn's chest shatters. The world turns red, and every sound becomes a distant hum.", "Bangun, Penjaga. Kematian belum mau menerimamu.": "Wake up, Guardian. Death does not want you yet.", "Anggap saja ini kesempatan kedua. Aku hanya menawarkannya sekali.": "Consider this a second chance. I only offer it once.", "Rantai berkarat itu putus satu per satu. Kepala desa tua berlutut, napasnya kembali sebagai desah lega.": "The rusted chains snap one by one. The old village head kneels, his breath returning as a sigh of relief.", "Terima kasih, Penjaga. Di Gua Tulang ada peramal buta yang dirantai. Ia tahu ke mana Laras dibawa.": "Thank you, Guardian. In the Bone Cave there is a chained blind seer. She knows where Laras was taken.", "Beristirahatlah, Pak Tua.": "Rest well, old man.", "Rawa Ghul menghela napas panjang untuk pertama kalinya dalam sepuluh tahun.": "Ghul Swamp exhales deeply for the first time in ten years.", "Jagal Gua ambruk. Rantai yang mengikat Sirin berderak lepas, dan peramal buta itu meraba mencari Varn.": "The Cave Butcher collapses. The chains binding Sirin rattle loose, and the blind seer gropes in search of Varn.", "Kau membebaskanku. Ambil kalung itu, Penjaga. Ia menyimpan sisa cahaya Laras.": "You freed me. Take the necklace, Guardian. It holds the remnant of Laras's light.", "Kalung kayu itu berpendar hijau di telapak tangan Varn. Dari cahayanya, siluet anak kecil muncul, melayang dan tersenyum.": "The wooden necklace glows green in Varn's palm. From its light, a child's silhouette emerges, floating and smiling.", "Laras... Ayah di sini.": "Laras... Father is here.", "Ingat ramalanku, Varn: dua akhir. Pilihan terakhir tetap milikmu.": "Remember my prophecy, Varn: two endings. The final choice is still yours.", "Api Ashur meredup. Sosok raksasa itu menyusut menjadi bayangan seorang lelaki tua berzirah.": "Ashur's flame dims. The giant shrinks into the shadow of an old man in armor.", "Selene tak pernah meminta kami dibunuh. Ia hanya meminta kau berada di sisinya saat ia pergi.": "Selene never asked us to be killed. She only asked you to be at her side when she left.", "Kalau begitu, hiduplah dengan itu. Itu hukuman terberat yang bisa kuberikan.": "Then live with that. It is the heaviest punishment I can give.", "Lava di bawah jembatan mendingin, membeku menjadi kaca hitam. Jalan ke Kuil Fajar terbuka.": "The lava beneath the bridge cools, freezing into black glass. The path to the Dawn Temple is open.", "HANYA PEDANG KSATRIA": "KNIGHT SWORD ONLY", "PEDANG BELUM SIAP": "SWORD NOT READY", "ROH BELUM SIAP": "SPIRIT NOT READY", "TAK ADA SASARAN": "NO TARGET", "PANAH ROH": "SPIRIT ARROW", "ROH LARAS BERGABUNG": "LARAS'S SPIRIT JOINS", "DESA KARROW": "KARROW VILLAGE", "RAWA GHUL": "GHUL SWAMP", "GUA TULANG": "BONE CAVE", "LORONG SEGEL": "SEAL CORRIDOR", "JEMBATAN API": "FIRE BRIDGE", "KUIL FAJAR RETAK": "CRACKED DAWN TEMPLE", "ALTAR MALAKAR": "MALAKAR'S ALTAR", "JURANG GERBANG": "GATE ABYSS", "PADANG PENYESALAN": "FIELD OF REGRET", "SINGGASANA NYARAK": "NYARAK'S THRONE", "KEPALA DESA BERANTAI": "CHAINED VILLAGE HEAD", "JAGAL GUA": "CAVE BUTCHER", "ASHUR, BAYANG DEWA": "ASHUR, SHADOW OF A GOD", "Bilah Darah: serangan +50%": "Blood Blade: attack +50%", "Zirah Tulang: HP maks +25": "Bone Armor: max HP +25", "Murka: isi amarah +30%": "Wrath: rage gain +30%", "GERBANG TERBUKA": "GATE OPENED", "SALAH, ULANGI": "WRONG, TRY AGAIN", "Pedang Ksatria": "Knight's Sword", "Tombak Cahaya": "Light Spear", "Palu Gunung": "Mountain Hammer", "Rantai Api": "Fire Chain", "Katana Fajar": "Dawn Katana", "SENJATA BARU": "NEW WEAPON", "Senjata baru: ": "New weapon: ", "Bisikan gerbang besi: nyalakan tuas bertanda angka menurut urutan ini: ": "Iron gate whisper: light the numbered levers in this order: ", ". Salah sekali, ulang dari awal. Di baliknya ada harta.": ". One mistake and you start over. Treasure lies beyond.", "PARRY SEMPURNA": "PERFECT PARRY", "KOMBO x": "COMBO x", "KOTAK T {const t2=(a,b)=>{EN[a]=b;return a},sc=(...r)=>r.map(x=>[x[0],t2(x[1],x[2])]),M=(i,k,l)=>{(A[i].m=A[i].m||{})[k]=l};
FR.push(['KARROW BAYANGAN','SHADOW KARROW'],['MENARA LONCENG','BELL TOWER']);
M(0,1,sc(['','Di antara puing ada lonceng desa yang retak. Talinya masih tergantung.','Among the rubble is the village bell, cracked. The rope still hangs from it.'],['VARN','Laras suka menarik tali ini. Kakinya tidak sampai lantai, jadi dia melompat.','Laras liked pulling this rope. Her feet did not reach the floor, so she jumped.'],['','Dari utara terdengar dentang lonceng yang lain. Mayat-mayat di sekitarnya mulai bergerak lebih cepat.','Another bell rings in the north. The corpses around him start moving faster.']));
M(0,3,sc(['','Di dinding bengkel pandai besi ada gambar matahari dengan tujuh garis, tanda Penjaga Fajar. Catnya sudah mengelupas.','On the blacksmith shop wall is a drawing of a sun with seven lines, the mark of the Dawn Guardians. The paint is peeling.'],['VARN','Kael yang mengajariku menggambarnya. Satu garis untuk satu sumpah.','Kael taught me to draw it. One line for each oath.'],['VARN','Aku melanggar semuanya, satu per satu.','I broke every one of them, one at a time.']));
M(1,1,sc(['ARWAH','Selene sering ke rawa ini mencari tumbuhan obat untuk anak-anak yang demam. Dia tidak pernah takut pada kami.','Selene used to come to this swamp to gather herbs for children with fevers. She was never afraid of us.'],['VARN','Dia memang begitu.','That was her.'],['ARWAH','Waktu sakit terakhir pun dia masih menyebut namamu. Dia tidak marah.','Even when she was dying she still said your name. She was not angry.']));
M(1,4,sc(['','Dari balik kabut ada yang bersenandung. Lagu pengantar tidur yang dulu dinyanyikan di Karrow.','Someone is humming in the fog. The lullaby they used to sing in Karrow.'],['VARN','Selene yang mengajarkan lagu itu pada Laras.','Selene taught that song to Laras.'],['ARWAH','Malakar tidak tahan mendengarnya. Setiap kali ada yang menyanyikan lagu itu, dia mengamuk.','Malakar cannot stand that song. Every time someone sings it, he goes into a rage.']));
M(2,1,sc(['SIRIN','(dari jauh) Malakar tahu kau di sini. Dia mendengar setiap langkahmu lewat tulang-tulang ini.','(from far away) Malakar knows you are here. He hears every step through these bones.'],['VARN','Dia bisa mendengar kita dari sini?','He can hear us from here?'],['SIRIN','(dari jauh) Gua ini perutnya. Jadi ya.','(from far away) This cave is his stomach. So yes.']));
M(2,4,sc(['','Dinding gua penuh nama yang digores dengan kuku. Salah satunya KAEL.','The cave wall is scratched with names, carved with fingernails. One of them says KAEL.'],['VARN','Dia pernah ke sini. Sebelum menelan fajar.','He was here. Before he swallowed the dawn.'],['SIRIN','(dari jauh) Dia mencari cara menutup gerbang tanpa ada yang mati. Tidak ketemu. Akhirnya dia sendiri yang jadi bayarannya.','(from far away) He was looking for a way to close the gate without anyone dying. He did not find one. In the end he made himself the price.']));
M(3,1,sc(['','Ukiran di dinding berubah. Sekarang ada dua sosok: Penjaga muda dan gurunya, menyalakan obor di depan gerbang emas.','The carving on the wall changes. Now there are two figures: a young Guardian and his master, lighting a torch in front of a golden gate.'],['VARN','Hari itu aku bersumpah tidak akan pernah membukanya.','That day I swore I would never open it.'],['SUARA','Sampai ada perempuan yang sekarat di pelukanmu.','Until a woman was dying in your arms.']));
M(3,3,sc(['SUARA','Kau pikir Kael tidak tahu kau akan membukanya? Dia tahu. Dia memilih diam.','You think Kael did not know you would open it? He knew. He chose to say nothing.'],['VARN','Diam!','Be quiet!'],['SUARA','Dia percaya padamu, Varn. Bagian itu yang tidak bisa kau terima.','He trusted you, Varn. That is the part you cannot accept.']));
M(4,1,sc(['ASHUR','Kau ingat namaku? Tidak. Kau hanya ingat berapa banyak dari kami yang kau penggal.','Do you remember my name? No. You only remember how many of us you beheaded.'],['VARN','Dua belas.','Twelve.'],['ASHUR','Kami bukan dewa jahat. Kami juga penjaga gerbang itu, sama sepertimu.','We were not evil gods. We guarded that gate too, just like you.']));
M(4,3,sc(['','Lava di bawah jembatan membentuk dua belas wajah. Semuanya menatap Varn. Tidak ada yang marah.','The lava under the bridge forms twelve faces. All of them look at Varn. None of them are angry.'],['VARN','Kalian tidak marah?','You are not angry?'],['ASHUR','Kami sudah capek marah. Kami hanya menunggu ada yang mau mengerti.','We are tired of being angry. We just waited for someone willing to understand.']));
M(5,1,sc(['','Di kaki patung Kael ada gulungan surat. Tulisan tangan gurunya.','At the foot of the Kael statue lies a rolled-up letter. His master handwriting.'],['KAEL','Untuk muridku. Kalau kau membaca ini, berarti aku sudah memilih. Jangan cari aku dengan pedang.','To my student. If you are reading this, I have already made my choice. Do not look for me with a sword.'],['VARN','Guru tidak pernah menjelaskan apa pun sampai tuntas.','You never explained anything fully, Master.']));
M(5,3,sc(['','Di halaman terakhir gulungan, tulisan Kael makin berantakan.','On the last page of the letter, Kael handwriting gets messier.'],['KAEL','Soal pedagang itu. Dia tidak pernah bohong soal harga, hanya soal siapa yang membayar. Ingat itu.','About the merchant. He never lies about the price, only about who pays it. Remember that.']));
M(7,1,sc(['NYARAK','(dari dasar jurang) Kau pernah bertanya kenapa aku mau menolongmu sepuluh tahun lalu?','(from the bottom of the pit) Did you ever ask why I agreed to help you ten years ago?'],['VARN','Itu bukan menolong. Itu jual beli.','That was not help. That was a trade.'],['NYARAK','(dari dasar jurang) Memang. Tapi kau tidak membaca syaratnya, kan?','(from the bottom of the pit) It was. But you never read the terms, did you?']));
M(7,3,sc(['SUARA','Varn, jangan percaya dia. Gerbang itu bukan jalan keluar. Itu jalan masuk.','Varn, do not trust him. That gate is not a way out. It is a way in.'],['VARN','Masuk ke mana?','In to where?'],['SUARA','Tempat semua yang dibuang orang berkumpul. Mereka sudah lama menunggu, dan mereka lapar.','The place where everything people threw away ends up. They have waited a long time, and they are hungry.']));
M(8,1,sc(['SELENE','(dari kabut) Bunga kering yang kuberikan masih kau simpan? Di saku zirahmu?','(from the fog) You still keep the dried flower I gave you? In your armor pocket?'],['VARN','Setiap hari. Sepuluh tahun.','Every day. Ten years.'],['SELENE','(dari kabut) Aku tahu. Makanya aku bisa menemukanmu di sini.','(from the fog) I know. That is how I found you here.']));
M(8,4,sc(['','Kabut menipis sebentar. Jauh di depan ada menara tua. Loncengnya berbunyi sendiri.','The fog thins for a moment. Far ahead stands an old tower. Its bell rings on its own.'],['SELENE','(dari kabut) Itu Menara Lonceng. Ada yang menunggumu di atas. Jalan terus, Varn.','(from the fog) That is the Bell Tower. Someone is waiting for you at the top. Keep going, Varn.']));
END.splice(7,0,...sc(['LARAS','Jangan sedih, Ayah. Aku baik-baik saja di sini.','Do not be sad, Father. I am fine here.'],['VARN','(suaranya bergetar) Kalau begitu aku akan duduk di sini tiap pagi. Sampai kau bosan.','(his voice shaking) Then I will sit here every morning. Until you get bored of me.']));
END2.splice(4,0,...sc(['KAEL','Muridku. Fajarnya sudah kembali. Terima kasih sudah memilih bertahan.','My student. The dawn is back. Thank you for choosing to stay.'],['SELENE','Kau berhasil. Kami semua melihatnya.','You did it. We all saw.']));
const P11=sc(['','Karrow Bayangan. Semua rumah masih utuh, tapi jendelanya gelap. Setiap bayangan di tanah menghadap ke Varn.','Shadow Karrow. Every house is intact, but the windows are dark. Every shadow on the ground faces Varn.'],['','Tidak ada api, tidak ada asap. Rumah-rumah berdiri seperti sebelum malam itu.','No fire, no smoke. The houses stand as they did before that night.'],['NYARAK','Selamat datang di desa yang tidak pernah terbakar. Semua orang di sini masih hidup. Kecuali yang kau cari.','Welcome to the village that never burned. Everyone here is still alive. Except the one you are looking for.'],['VARN','Berhenti mengelak. Di mana Laras?','Stop dodging. Where is Laras?'],['NYARAK','Di tempat kau meninggalkannya. Di balik pintu yang tidak pernah kau buka.','Where you left her. Behind the door you never opened.'],['','Bayangan para penduduk bangkit dari tanah. Ada yang membawa cangkul, ada yang membawa obor. Wajah mereka sama seperti hari Varn pergi.','The shadows of the villagers rise from the ground. Some hold hoes, some hold torches. Their faces are the same as the day Varn left.']);
const P12=sc(['','Menara Lonceng. Tangga spiral naik ke dalam gelap. Setiap beberapa puluh anak tangga ada lonceng retak yang berdenting sendiri.','Bell Tower. A spiral staircase climbs into the dark. Every few dozen steps, a cracked bell rings by itself.'],['LARAS','(dari atas) Ayah, loncengnya berbunyi tiap kali Ayah ragu.','(from above) Father, the bells ring every time you hesitate.'],['VARN','Kalau begitu dengarkan. Aku tidak akan ragu lagi.','Then listen. I will not hesitate again.'],['','Dinding menara penuh catatan harian yang ditulis dengan darah. Tulisan Kael, hari demi hari selama sepuluh tahun.','The tower walls are covered in diary entries written in blood. Kael handwriting, day after day for ten years.'],['KAEL','Hari ke-3.652. Fajar di perutku makin berat. Aku sudah lupa nama mereka, tapi suara anak-anak itu masih kuingat.','Day 3,652. The dawn in my stomach gets heavier. I have forgotten their names, but I still remember the children voices.'],['KAEL','Kalau muridku membaca ini: jangan terima tawaran yang sama dari Nyarak.','If my student reads this: do not accept the same offer from Nyarak.']);
